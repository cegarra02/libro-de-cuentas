<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libro de Cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Concepto: un libro contable de una sola columna. Fondo gris azulado, hojas claras,
   cifras grandes con doble raya contable. Un solo azul para la interfaz y los gráficos. */
:root{
  --page:#eef1f4; --surface:#fbfcfd; --wash:#f1f4f7;
  --ink:#0f1722; --ink-2:#465263; --ink-3:#5b6676;
  --line:#e0e5eb; --base:#c5ccd6; --track:#e3e8ee;
  --btn:#1f5fae; --link:#1f5fae;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --ctx:#7b8594;
  --pos:#006300; --neg:#c93636; --warn:#fab219; --crit:#d03b3b;
  --shadow:0 6px 20px rgba(15,23,34,.14);
  --f-head:"Bricolage Grotesque","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0d1013; --surface:#161a1e; --wash:#1b2026;
    --ink:#eef1f5; --ink-2:#b7c0cc; --ink-3:#98a3b1;
    --line:#262c33; --base:#38404a; --track:#262d35;
    --btn:#2a6fc4; --link:#86b6ef;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --ctx:#8a94a1;
    --pos:#0ca30c; --neg:#ef6b6b;
    --shadow:0 6px 20px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0d1013; --surface:#161a1e; --wash:#1b2026;
  --ink:#eef1f5; --ink-2:#b7c0cc; --ink-3:#98a3b1;
  --line:#262c33; --base:#38404a; --track:#262d35;
  --btn:#2a6fc4; --link:#86b6ef;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --ctx:#8a94a1;
  --pos:#0ca30c; --neg:#ef6b6b;
  --shadow:0 6px 20px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:400 15px/1.5 var(--f-body)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:1080px;margin-inline:auto;padding-inline:16px;padding-block:0 56px}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--page);padding-top:14px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 22px/1.1 var(--f-head);letter-spacing:-.01em}
.status{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;border-bottom:1px solid var(--base);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tab:hover{color:var(--ink)}
main{padding-top:6px}

/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--base);border-radius:8px;background:transparent;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.ghost{border-color:transparent;color:var(--link)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:13px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=date],select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--base);border-radius:8px;background:var(--surface);font-size:16px}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--base);border-radius:8px;background:var(--surface);color:var(--ink);font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;white-space:pre;overflow-x:auto}
.hint{font-size:12.5px;color:var(--ink-3)}
.err{font-size:13.5px;color:var(--neg);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--base);border-radius:8px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--base)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--page)}

/* mes */
.monthbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px 0 4px}
.monthbar h2{white-space:nowrap}
.monthbar h2{font:700 20px/1.2 var(--f-head)}
.monthbar .nav{display:flex;gap:6px}

/* cifra principal */
.hero{padding:14px 0 6px}
.hero .cap{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.hero .big{display:inline-block;margin-top:4px;font:600 clamp(40px,11vw,64px)/1.05 var(--f-body);letter-spacing:-.025em;border-bottom:5px double var(--ink);padding-bottom:4px;overflow-wrap:anywhere}
.hero .delta{margin-top:10px;font-size:14px;color:var(--ink-2)}
.facts{display:flex;flex-wrap:wrap;gap:12px 32px;padding:14px 0 18px}
.fact{min-width:0}
.fact .k{display:block;font-size:12.5px;color:var(--ink-2)}
.fact .v{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* tarjetas */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:6px}
.stack-v{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.card h2{font:600 17px/1.25 var(--f-head)}
.sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 6px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.chart{min-width:0}
.chart svg{display:block;max-width:100%;touch-action:pan-y}
.ax{fill:var(--ink-3);font:12px var(--f-body)}
.ax.on{fill:var(--ink);font-weight:700}
svg .grid{stroke:var(--line);stroke-width:1}
svg .base{stroke:var(--base);stroke-width:1}
svg .hov{fill:transparent}
svg .hov.on{fill:var(--wash)}
.empty{padding:18px 4px;color:var(--ink-2);font-size:14px}
.tw{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:12.5px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}

/* barras horizontales */
.hb{display:grid;grid-template-columns:minmax(0,7.4rem) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 4px;border-radius:6px;cursor:default}
.hb:hover,.hb:focus-visible{background:var(--wash)}
.hb .nm{font-size:13.5px;line-height:1.25}
.hb .tr{height:14px}
.hb .fl{height:14px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hb .vl{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* medidor y reparto */
.meter{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:4px;background:var(--s1)}
.meter.warn>i{background:var(--warn)} .meter.over>i{background:var(--crit)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip.warn::before,.chip.over::before{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font-size:11px;font-weight:800;color:#1a1200;background:var(--warn)}
.chip.over::before{background:var(--crit);color:#fff}
.chip.over{color:var(--neg)}
.alloc{display:flex;gap:2px;height:20px;margin:10px 0 12px}
.alloc>i{display:block;min-width:3px;border-radius:2px;flex-basis:0}
.alloc>i:first-child{border-radius:4px 2px 2px 4px}.alloc>i:last-child{border-radius:2px 4px 4px 2px}
.al-leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:6px 18px}
.al-leg div{white-space:nowrap}
.al-leg div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.al-leg b{margin-left:auto;font-variant-numeric:tabular-nums}

/* libro de movimientos */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:8px 0 4px}
.tools .field{flex:1 1 200px}
.day{display:flex;justify-content:space-between;gap:8px;padding:18px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--base)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;width:100%;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:hover{background:var(--wash)}
.r-main{font-weight:500;overflow-wrap:anywhere}
.r-amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.r-sub{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.sumline{font-size:13.5px;color:var(--ink-2);padding:6px 0}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--wash);font-size:13.5px;color:var(--ink-2)}

/* presupuestos */
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.brow .r-amt{white-space:nowrap}
.brow input{width:112px}
.brow .nm{font-weight:600}
.brow .meter{grid-column:1/-1;margin-top:4px}
.brow .st{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.brow input{text-align:right;min-height:38px;padding:6px 8px}

/* inversiones */
.pos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.pc-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pc-head h3{font:600 17px/1.25 var(--f-head);overflow-wrap:anywhere}
.tp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.pc-val{text-align:right}
.pc-val b{display:block;font-size:20px;letter-spacing:-.01em}
.pc-val span{font-size:13px;font-weight:600}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px 14px;margin:14px 0}
.kv{min-width:0}
.kv .k{display:block;font-size:12px;color:var(--ink-2)}
.kv .v{display:block;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv input{min-height:34px;padding:4px 8px;font-size:15px;font-weight:600}
.kv .cap{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.field[hidden]{display:none}
.sub-chart{margin-top:4px}
.sub-chart .card-head h2{font-size:15px}
.pc-ctl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.pc-ctl .seg.scroll{max-width:100%;overflow-x:auto}
.pc-ctl .seg button{padding:8px 10px;white-space:nowrap}
.pc-sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:4px 0 2px;font-size:14px;font-weight:600}
.pc-sum .pc-px{font:700 22px/1.2 var(--f-head)}
.pc-per{color:var(--ink-3);font-weight:500;font-size:12.5px}
.hits{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.res-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:48px;padding:9px 12px;border:1px solid var(--base);border-radius:8px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.res-item b{font-weight:600;font-size:14.5px}.res-item span{font-size:12.5px;color:var(--ink-2)}
.res-item:hover,.res-item:focus-visible{border-color:var(--s1)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
details{margin-top:12px;border-top:1px solid var(--line)}
summary{padding:10px 0;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.op{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.op .d{color:var(--ink-3);white-space:nowrap}
.op .t{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.op .a{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.op .x{grid-column:1/-1;display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--ink-3);font-size:12.5px}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}

/* calculadoras */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:10px;align-items:start}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:12px 0}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 14px;padding:12px 0 2px;border-top:1px solid var(--line)}
.res .v{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.res .k{display:block;font-size:12.5px;color:var(--ink-2)}
.wide{grid-column:1/-1}

/* diálogo, aviso y globo */
dialog{padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(480px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,12,18,.55)}
.form{display:flex;flex-direction:column;gap:14px;padding:20px}
.form h2{font:700 20px/1.2 var(--f-head)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
.form .btns .spacer{margin-right:auto}
.tip{position:fixed;z-index:50;left:0;top:0;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--base);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px;max-width:250px}
.tip .t{font-weight:600;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:6px;line-height:1.5}
.tip .r i{display:block;width:12px;height:3px;border-radius:2px;flex:none}
.tip .r .k{color:var(--ink-2)}
.tip .r .v{margin-left:auto;padding-left:12px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--page);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;max-width:calc(100vw - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--ink-2)}
@media (max-width:420px){.form .two{grid-template-columns:1fr}.brand{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div>
        <h1 class="brand">Libro de Cuentas</h1>
        <span class="status" id="status" role="status">Cargando…</span>
      </div>
      <button class="btn primary" id="addMov" type="button">+ Movimiento</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
  </header>
  <main id="main" role="tabpanel"><div class="loading">Cargando tus datos…</div></main>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="dlg" aria-modal="true"></dialog>

<script>
(function(){
'use strict';

/*#PURE*/
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const CATS_GASTO=[
  {id:'vivienda',n:'Vivienda'},{id:'super',n:'Supermercado'},{id:'transporte',n:'Transporte'},
  {id:'ocio',n:'Restaurantes y ocio'},{id:'suscr',n:'Suscripciones'},{id:'salud',n:'Salud'},
  {id:'compras',n:'Ropa y compras'},{id:'viajes',n:'Viajes'},{id:'otros',n:'Otros gastos'}];
const CATS_INGRESO=[
  {id:'nomina',n:'Nómina'},{id:'extra',n:'Ingresos extra'},{id:'rend',n:'Rendimientos'},{id:'oingr',n:'Otros ingresos'}];
const TIPOS_INV=[
  {id:'fondo',n:'Fondo indexado',c:1},{id:'etf',n:'ETF',c:2},{id:'accion',n:'Acciones',c:3},
  {id:'rf',n:'Renta fija y depósitos',c:4},{id:'cripto',n:'Criptomonedas',c:5},{id:'otro',n:'Otro',c:6}];

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const todayISO=()=>iso(new Date());
const ymOf=d=>d.slice(0,7);
const addDaysISO=(d,k)=>{const x=parseISO(d);x.setDate(x.getDate()+k);return iso(x);};
const daysInMonth=ym=>{const a=ym.split('-').map(Number);return new Date(a[0],a[1],0).getDate();};
const addMonths=(ym,k)=>{const a=ym.split('-').map(Number);const d=new Date(a[0],a[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const r2=n=>Math.round(n*100)/100;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function parseNum(s){
  if(typeof s==='number') return s;
  s=String(s==null?'':s).trim().replace(/[\s€%]/g,'');
  if(!s) return NaN;
  if(s.indexOf(',')>=0){ s=s.replace(/\./g,'').replace(',','.'); }
  else if((s.match(/\./g)||[]).length>1){ s=s.replace(/\./g,''); }
  else if(/^[1-9]\d{0,2}\.\d{3}$/.test(s)){ s=s.replace('.',''); }
  const n=Number(s); return isFinite(n)?n:NaN;
}

const RANK={compra:0,dividendo:1,venta:2};
function opsSorted(p){return p.ops.slice().sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(RANK[a.tipo]-RANK[b.tipo]));}

/* Posición con método FIFO (el que aplica Hacienda a fondos y acciones homogéneas). */
function calcPos(p,until){
  const lots=[]; let real=0,divs=0,comp=0,vent=0,over=false; const flows=[];
  for(const o of opsSorted(p)){
    if(until && o.fecha>until) break;
    if(o.tipo==='compra'){
      const cost=o.uds*o.precio+(o.com||0);
      if(o.uds>0) lots.push({u:o.uds,c:cost/o.uds});
      comp+=cost; flows.push({f:o.fecha,a:-cost});
    }else if(o.tipo==='venta'){
      let q=o.uds,consumed=0; const proceeds=o.uds*o.precio-(o.com||0);
      while(q>1e-9 && lots.length){
        const l=lots[0],t=Math.min(l.u,q); consumed+=t*l.c; l.u-=t; q-=t;
        if(l.u<=1e-9) lots.shift();
      }
      if(q>1e-6) over=true;
      real+=proceeds-consumed; vent+=proceeds; flows.push({f:o.fecha,a:proceeds});
    }else if(o.tipo==='dividendo'){
      divs+=o.importe||0; flows.push({f:o.fecha,a:o.importe||0});
    }
  }
  const u=lots.reduce((a,l)=>a+l.u,0), coste=lots.reduce((a,l)=>a+l.u*l.c,0);
  const valor=u*(p.precio||0), lat=valor-coste;
  return {u,coste,valor,lat,latPct:coste>0?lat/coste:0,real,divs,comp,vent,flows,over,

}

/* TIR anualizada (XIRR) por bisección. Devuelve null si no hay datos suficientes. */
function xirr(flows,endDate,endValue){
  const cf=flows.map(x=>({t:parseISO(x.f).getTime(),a:x.a}));
  if(endValue>1e-9) cf.push({t:parseISO(endDate).getTime(),a:endValue});
  if(cf.length<2) return null;
  if(!cf.some(x=>x.a<0)||!cf.some(x=>x.a>0)) return null;
  const t0=Math.min.apply(null,cf.map(x=>x.t)), t1=Math.max.apply(null,cf.map(x=>x.t));
  if((t1-t0)/864e5<60) return null;
  const f=r=>cf.reduce((s,x)=>s+x.a/Math.pow(1+r,(x.t-t0)/(365*864e5)),0);
  let lo=-0.95,hi=10,flo=f(lo),fhi=f(hi);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0) return null;
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,fm=f(mid); if(flo*fm<=0){hi=mid;fhi=fm;}else{lo=mid;flo=fm;}}
  return (lo+hi)/2;
}

/* Calculadoras */
function rentRapida(o){
  const gan=o.fin-o.ini, tot=o.ini>0?gan/o.ini:0;
  const dias=Math.round((parseISO(o.hasta)-parseISO(o.desde))/864e5);
  const anios=dias/365.25;
  const anual=(o.ini>0&&o.fin>0&&anios>0)?Math.pow(o.fin/o.ini,1/anios)-1:null;
  const neto=gan>0?o.fin-gan*(o.tax/100):o.fin;
  return {gan,tot,dias,anual,neto};
}
function proyectar(o){
  const rm=Math.pow(1+o.rent/100,1/12)-1; let bal=o.ini,aport=o.ini; const pts=[{y:0,v:bal,a:aport}];
  for(let m=1;m<=o.anios*12;m++){bal=bal*(1+rm)+o.mens; aport+=o.mens; if(m%12===0) pts.push({y:m/12,v:bal,a:aport});}
  const real=bal/Math.pow(1+o.infl/100,o.anios);
  return {pts,final:bal,aportado:aport,intereses:bal-aport,real};
}
function aportNecesaria(o){
  const n=o.anios*12, rm=Math.pow(1+o.rent/100,1/12)-1;
  const g=Math.pow(1+rm,n);
  let a=rm===0?(o.meta-o.ini)/n:(o.meta-o.ini*g)*rm/(g-1);
  const yaLlega=a<=0; if(yaLlega) a=0;
  return {mens:a,aportado:o.ini+a*n,intereses:o.meta-(o.ini+a*n),yaLlega};
}

/* Fechas, históricos de precios y operaciones pegadas desde una hoja de cálculo o un bróker. */
function parseDateAny(s){
  s=String(s==null?'':s).trim().replace(/^"|"$/g,'');
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T].*)?$/),y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})(?:[ T].*)?$/); if(!m) return null; d=+m[1];mo=+m[2];y=+m[3]; if(y<100) y+=2000;}
  if(mo<1||mo>12||d<1||d>31||y<1970||y>2100) return null;
  const dt=new Date(y,mo-1,d); if(dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
function normHp(a){
  const m={}; (Array.isArray(a)?a:[]).forEach(x=>{if(Array.isArray(x)&&/^\d{4}-\d{2}-\d{2}$/.test(x[0])&&isFinite(+x[1])&&+x[1]>0) m[x[0]]=Math.round(+x[1]*1e4)/1e4;});
  return Object.keys(m).sort().map(k=>[k,m[k]]);
}
function downsample(hp,max){
  max=max||700; if(hp.length<=max) return hp;
  const wk=x=>Math.floor(parseISO(x[0]).getTime()/6048e5);
  return hp.filter((x,i)=>i===hp.length-1||wk(hp[i+1])!==wk(x));
}
function splitLine(line,delim){return line.split(delim).map(c=>c.trim().replace(/^"|"$/g,''));}
function parsePrices(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return {rows:[],bad:0};
  const semi=/[;\t]/.test(lines.join('\n')), delim=semi?/[;\t]/:',', num=c=>semi?parseNum(c):Number(c);
  let col=1,start=0; const first=splitLine(lines[0],delim);
  if(!parseDateAny(first[0])){
    start=1; const nm=first.map(c=>c.toLowerCase());
    let i=nm.findIndex(c=>c==='close'||c==='cierre'); if(i<0) i=nm.findIndex(c=>/^(adj close|último|ultimo|price|precio|valor liquidativo|vl)/.test(c)); if(i>0) col=i;
  }
  const rows=[]; let bad=0;
  for(let i=start;i<lines.length;i++){
    const c=splitLine(lines[i],delim), d=parseDateAny(c[0]), v=num(c[col]);
    if(d&&isFinite(v)&&v>0) rows.push([d,v]); else bad++;
  }
  return {rows:normHp(rows),bad};
}
function parseOps(text){
  const out=[],errs=[];
  String(text||'').split(/\r?\n/).forEach((raw,idx)=>{
    const line=raw.trim(); if(!line||line[0]==='#') return;
    const c=(/[;\t]/.test(line)?line.split(/[;\t]/):line.split(/\s+/)).map(x=>x.trim().replace(/^"|"$/g,''));
    const d=parseDateAny(c[0]);
    if(!d){ if(!errs.length&&!out.length&&/[a-zA-Z]/.test(c[0])) return; errs.push('Línea '+(idx+1)+': la fecha no es válida.'); return; }
    let t=null,k=1; const w=(c[1]||'').toLowerCase();
    if(/^[a-zñ]/.test(w)){k=2; t=/^[cb]/.test(w)?'compra':/^[vs]/.test(w)?'venta':/^[di]/.test(w)?'dividendo':'?';}
    if(t==='?'){errs.push('Línea '+(idx+1)+': tipo no reconocido (usa compra, venta o dividendo).');return;}
    if(t==='dividendo'){
      const imp=parseNum(c[k]); if(!(imp>0)){errs.push('Línea '+(idx+1)+': falta el importe del dividendo.');return;}
      out.push({fecha:d,tipo:'dividendo',uds:0,precio:0,com:0,importe:imp}); return;
    }
    let u=parseNum(c[k]); const pr=parseNum(c[k+1]), cs=c[k+2], com=(cs==null||cs==='')?0:parseNum(cs);
    if(!isFinite(u)||u===0||!(pr>0)||!isFinite(com)){errs.push('Línea '+(idx+1)+': revisa unidades, precio y comisión.');return;}
    if(u<0){if(!t) t='venta'; u=-u;}
    out.push({fecha:d,tipo:t||'compra',uds:u,precio:pr,com:Math.abs(com),importe:0});
  });
  return {ops:out,errs};
}
function priceAt(hp,date){
  let lo=0,hi=hp.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(hp[m][0]<=date){r=m;lo=m+1;}else hi=m-1;}
  return r>=0?hp[r][1]:null;
}
/* Serie de la cartera: lo invertido sale de las operaciones; el valor, del histórico de precios o de las valoraciones guardadas. */
function buildHistory(pos,snaps,today){
  let first=null; pos.forEach(p=>p.ops.forEach(o=>{if(!first||o.fecha<first) first=o.fecha;}));
  if(!first) return snaps.map(s=>({f:s.f,v:s.v,c:s.c}));
  const ds=new Set([first,today]); let ym=first.slice(0,7); const cur=today.slice(0,7);
  while(ym<cur){ds.add(ym+'-'+pad(daysInMonth(ym)));ym=addMonths(ym,1);}
  snaps.forEach(s=>ds.add(s.f));
  const sm={}; snaps.forEach(s=>{sm[s.f]=s;});
  return Array.from(ds).filter(d=>d>=first&&d<=today).sort().map(d=>{
    let c=0,v=0,ok=true;
    pos.forEach(p=>{
      if(d===today){const q=calcPos(p);c+=q.coste;v+=q.valor;return;}
      const q=calcPos({ops:p.ops,precio:0},d); c+=q.coste;
      if(q.u>1e-9){const pr=p.hp&&p.hp.length?priceAt(p.hp,d):null; if(pr==null) ok=false; else v+=q.u*pr;}
    });
    const val=ok?v:(sm[d]?sm[d].v:null);
    return {f:d,c:r2(c),v:val==null?null:r2(val)};
  });
}

/* Respuestas de Alpha Vantage y CoinMarketCap: se interpretan con cuidado porque pueden venir como error dentro de un resultado correcto. */
function dig(o){if(typeof o==='string'){try{return JSON.parse(o);}catch(e){return o;}}return o;}
function avProblem(o){
  o=dig(o);
  if(typeof o==='string') return {k:'raro',m:o.slice(0,140)};
  if(!o||typeof o!=='object') return {k:'raro',m:'Respuesta vacía'};
  const e=o.error, msg=(e&&(e.message||(typeof e==='string'?e:'')))||o['Error Message']||o.Information||o.Note||null;
  if(!msg) return null;
  const t=String(e&&e.type||'')+' '+msg, m=String(msg).slice(0,160);
  if(/rate.?limit|per (second|day|minute)|call frequency|requests/i.test(t)) return {k:'limite',m};
  if(/invalid api call|invalid|not found|no data/i.test(t)) return {k:'simbolo',m};
  if(/premium/i.test(t)) return {k:'premium',m};
  return {k:'otro',m};
}
function parseAvQuote(o){
  const p=avProblem(o); if(p) return {err:p}; o=dig(o);
  const q=o&&o['Global Quote'], pr=q&&+q['05. price'];
  if(!q||!(pr>0)) return {err:{k:'simbolo',m:'Alpha Vantage no tiene datos de ese símbolo'}};
  return {price:pr,date:parseDateAny(q['07. latest trading day'])};
}
function parseAvRate(o){
  const p=avProblem(o); if(p) return {err:p}; o=dig(o);
  const bk=o&&Object.keys(o).find(k=>/exchange rate/i.test(k)), b=bk&&o[bk];
  const rk=b&&typeof b==='object'&&Object.keys(b).find(k=>/exchange rate$/i.test(k)), r=rk&&+b[rk];
  return r>0?{rate:r}:{err:{k:'otro',m:'No he podido leer el tipo de cambio'}};
}
function parseAvSeries(o){
  const p=avProblem(o); if(p) return {err:p}; o=dig(o);
  const key=o&&Object.keys(o).find(k=>/time series/i.test(k)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]));
  if(!key) return {err:{k:'simbolo',m:'Alpha Vantage no tiene histórico de ese símbolo'}};
  const rows=[];
  Object.keys(o[key]).forEach(d=>{
    const r=o[key][d]||{}, ck=Object.keys(r).find(k=>/close/i.test(k)&&!/adjust/i.test(k))||Object.keys(r).find(k=>/close/i.test(k));
    const dt=parseDateAny(d); if(dt&&ck&&+r[ck]>0) rows.push([dt,+r[ck]]);
  });
  return {pts:normHp(rows),truncated:o[key+'_truncated']===true,total:o[key+'_total_count']};
}
function cmcRows(o){
  o=dig(o);
  if(Array.isArray(o)) return o.filter(x=>x&&typeof x==='object'&&!Array.isArray(x));
  if(o&&Array.isArray(o.headers)&&Array.isArray(o.rows)) return o.rows.map(r=>{const x={};o.headers.forEach((k,i)=>{x[k]=r[i];});return x;});
  return [];
}
function parseCmcQuotes(o){

function parseCmcSearch(o,q){
  q=String(q||'').trim().toLowerCase(); const rows=cmcRows(o).filter(r=>r.id!=null);
  const hit=rows.filter(r=>String(r.symbol).toLowerCase()===q||String(r.slug).toLowerCase()===q||String(r.name).toLowerCase()===q);

  return hit.length?{id:String(hit[0].id),name:String(hit[0].name||'')}:null;

function parseAvSearch(o){
  const p=avProblem(o); if(p) return {err:p}; o=dig(o);
  const arr=o&&Array.isArray(o.bestMatches)?o.bestMatches:[];
  const it=arr.map(x=>{

function curNorm(c){c=String(c||'EUR'); return (c==='GBp'||c==='GBX')?{code:'GBP',k:.01}:{code:c.toUpperCase(),k:1};}
function parseYhChart(o){

function niceScale(max){
  if(!(max>0)) return {step:1,top:4};
  const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),m=[1,2,2.5,5,10].find(x=>x*p>=raw-1e-9),step=m*p;
  return {step,top:step*4};
}
function mount(host,drawFn){
  let w0=0,cfg=null;
  const run=()=>{const w=Math.floor(host.clientWidth); if(w>0&&cfg){w0=w;drawFn(w,cfg);}};
  const ro=new ResizeObserver(()=>{const w=Math.floor(host.clientWidth); if(w>0&&w!==w0) run();});
  ro.observe(host);
  return {set(c){cfg=c; if(host.clientWidth>0) run(); else w0=0;}};
}

function columnChart(host,initial){
  const ctl=mount(host,(w,cfg)=>{
    const {labels,series,hi,aria}=cfg, H=230, m={t:10,r:6,b:28,l:46}, iw=w-m.l-m.r, ih=H-m.t-m.b;
    const mx=Math.max(1,...series.flatMap(s=>s.values)), sc=niceScale(mx), top=sc.top, Y=v=>m.t+ih-(v/top)*ih;
    const svg=sv('svg',{width:w,height:H,viewBox:'0 0 '+w+' '+H,role:'img','aria-label':aria});

        sv('text',{x:m.l-8,y:Y(v)+4,class:'ax','text-anchor':'end'},i?CMP.format(v):'0'));}
    const n=labels.length, band=iw/n, k=series.length, bw=Math.max(6,Math.min(24,(band*.72-(k-1)*2)/k)), gw=k*bw+(k-1)*2;
    labels.forEach((lb,i)=>{

      svg.append(bg);
      series.forEach((s,j)=>{const v=s.values[i], hh=(v/top)*ih; if(hh<.5) return;
        const x=gx+j*(bw+2), r=Math.min(4,bw/2,hh), yy=Y(v);
        svg.append(sv('path',{d:'M'+x+','+(m.t+ih)+'V'+(yy+r)+'Q'+x+','+yy+' '+(x+r)+','+yy+'H'+(x+bw-r)+'Q'+(x+bw)+','+yy+' '+(x+bw)+','+(yy+r)+'V'+(m.t+ih)+'Z',fill:s.color}));});
      svg.append(sv('text',{x:x0+band/2,y:H-8,class:'ax'+(i===hi?' on':''),'text-anchor':'middle'},lb));
      const rows=()=>series.map(s=>({color:s.color,k:s.name,v:money(s.values[i])}));
      const hit=sv('rect',{x:x0,y:m.t,width:band,height:ih+m.b-4,fill:'transparent',tabindex:0,'aria-label':cfg.tipTitle(i)+': '+series.map(s=>s.name+' '+money(s.values[i])).join(', ')});
      const on=e=>{bg.classList.add('on'); const r=hit.getBoundingClientRect(); showTip(e&&e.clientX!=null&&e.type!=='focus'?e.clientX:r.left+r.width/2,e&&e.clientY!=null&&e.type!=='focus'?e.clientY:r.top+30,cfg.tipTitle(i),rows());};
      const off=()=>{bg.classList.remove('on');hideTip();};
      hit.addEventListener('pointerenter',on);hit.addEventListener('pointermove',on);hit.addEventListener('pointerdown',on);
      hit.addEventListener('pointerleave',off);hit.addEventListener('focus',on);hit.addEventListener('blur',off);
      svg.append(hit);

}

function lineChart(host,initial){
  const ctl=mount(host,(w,cfg)=>{
    const {xs,series,aria}=cfg, H=240, m={t:12,r:14,b:28,l:46}, iw=w-m.l-m.r, ih=H-m.t-m.b;
    const x0=xs[0], x1=xs[xs.length-1], span=(x1-x0)||1, X=x=>m.l+(x-x0)/span*iw;
    const vals=series.flatMap(s=>s.values.filter(v=>v!=null)), mx=Math.max(cfg.fit?-Infinity:1,...vals);
    let bot=0, sc=niceScale(mx);
    if(cfg.fit&&vals.length){const lo=Math.min(...vals); sc=niceScale(Math.max(mx-lo,mx*.02||.01)*1.1); bot=Math.max(0,Math.floor(lo/sc.step)*sc.step); if(bot+sc.top<mx) sc=niceScale(mx-bot);}
    const top=sc.top, Y=v=>m.t+ih-((v-bot)/top)*ih, fmt=cfg.fmt||money, axf=cfg.axFmt||(v=>CMP.format(v));
    const svg=sv('svg',{width:w,height:H,viewBox:'0 0 '+w+' '+H,role:'img','aria-label':aria,tabindex:0});
    for(let i=0;i<=4;i++){const v=bot+sc.step*i;
      svg.append(sv('line',{x1:m.l,x2:w-m.r,y1:Y(v),y2:Y(v),class:i?'grid':'base'}),
        sv('text',{x:m.l-8,y:Y(v)+4,class:'ax','text-anchor':'end'},(i||bot>0)?axf(v):'0'));}
    const nt=Math.max(2,Math.min(cfg.maxTicks||6,Math.floor(iw/84)));
    cfg.xTicks(nt).forEach(tk=>{const x=X(tk.x), a=x-m.l<18?'start':(w-m.r-x<18?'end':'middle');
      svg.append(sv('text',{x,y:H-8,class:'ax','text-anchor':a},tk.label));});
    series.forEach(s=>{
      const pts=[]; s.values.forEach((v,i)=>{if(v!=null) pts.push([X(xs[i]),Y(v)]);});
      if(!pts.length) return;
      const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
      if(s.area) svg.append(sv('path',{d:d+'L'+pts[pts.length-1][0].toFixed(1)+','+Y(bot)+'L'+pts[0][0].toFixed(1)+','+Y(bot)+'Z',fill:s.color,'fill-opacity':.1}));
      svg.append(sv('path',{d,fill:'none',stroke:s.color,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
      const e=pts[pts.length-1]; svg.append(sv('circle',{cx:e[0],cy:e[1],r:4,fill:s.color,stroke:'var(--surface)','stroke-width':2}));
    });
    const cross=sv('g',{style:'display:none'}), vline=sv('line',{y1:m.t,y2:m.t+ih,stroke:'var(--base)','stroke-width':1}), dots=series.map(s=>sv('circle',{r:4,fill:s.color,stroke:'var(--surface)','stroke-width':2}));
    cross.append(vline,...dots); svg.append(cross);
    const show=(i,cx,cy)=>{
      const x=X(xs[i]); vline.setAttribute('x1',x); vline.setAttribute('x2',x); cross.style.display='';
      series.forEach((s,j)=>{const v=s.values[i]; if(v==null) dots[j].style.display='none'; else {dots[j].style.display='';dots[j].setAttribute('cx',x);dots[j].setAttribute('cy',Y(v));}});
      const r=svg.getBoundingClientRect();
      showTip(cx!=null?cx:r.left+x,cy!=null?cy:r.top+m.t+30,cfg.tipTitle(i),series.filter(s=>s.values[i]!=null).map(s=>({color:s.color,k:s.name,v:fmt(s.values[i])})));
    };
    const near=px=>{const t=x0+(px-m.l)/iw*span; let b=0,bd=Infinity; xs.forEach((x,i)=>{const dd=Math.abs(x-t); if(dd<bd){bd=dd;b=i;}}); return b;};
    let cur=xs.length-1;
    const move=e=>{const r=svg.getBoundingClientRect(); cur=near(e.clientX-r.left); show(cur,e.clientX,e.clientY);};
    const out=()=>{cross.style.display='none';hideTip();};
    svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',out);svg.addEventListener('blur',out);
    svg.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){cur=Math.max(0,cur-1);show(cur);e.preventDefault();}else if(e.key==='ArrowRight'){cur=Math.min(xs.length-1,cur+1);show(cur);e.preventDefault();}});
    host.replaceChildren(svg);
  });
  ctl.set(initial); return ctl;
}

function openForm(cfg){

      ctl.addEventListener('change',()=>changed(f.name));

      }else if(f.kind==='date'){ if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return fail('Falta «'+f.label+'».'); }

      out[f.name]=typeof v==='string'?v.trim():v;
    }
    const msg=cfg.onSubmit(out); if(msg) return fail(msg); DLG.close();
  });
  form.append(h('h2',null,cfg.title),...body,hint,err,
    h('div',{class:'btns'},cfg.extra?h('span',{class:'spacer'},cfg.extra):null,

function formOp(p){

/* Gráfica individual de cada inversión: valor frente a lo invertido, o precio frente a tu coste medio. */
function dateTicks(xs){
  const span=(xs[xs.length-1]-xs[0])/864e5;
  return n=>{const a=[];for(let i=0;i<n;i++){const x=xs[0]+(xs[xs.length-1]-xs[0])*i/(n-1),d=new Date(x);
    a.push({x,label:span<200?d.getDate()+' '+MESES_C[d.getMonth()]:MESES_C[d.getMonth()]+' '+String(d.getFullYear()).slice(2)});}return a;};
}
const RANGOS=[{v:'1m',t:'1 m',d:31},{v:'3m',t:'3 m',d:92},{v:'6m',t:'6 m',d:183},{v:'ytd',t:'Año'},{v:'1a',t:'1 a',d:366},{v:'5a',t:'5 a',d:1827},{v:'max',t:'Máx',d:0}];
function posSeries(p,vista,rango){
  const today=todayISO(), hp=p.hp||[], first=p.ops.map(o=>o.fecha).sort()[0]||'', val=vista==='valor';
  const r=RANGOS.find(x=>x.v===rango)||RANGOS[6];
  let from=val&&first?first:(hp[0]?hp[0][0]:today);
  const lim=r.v==='ytd'?today.slice(0,4)+'-01-01':(r.d?addDaysISO(today,-r.d):'');
  if(lim&&from<lim) from=lim;
  const ds=new Set([today]); hp.forEach(x=>{if(x[0]>=from) ds.add(x[0]);}); p.ops.forEach(o=>{if(o.fecha>=from) ds.add(o.fecha);});
  if(!val&&lim){const prev=hp.filter(x=>x[0]<from).pop(); if(prev) ds.add(prev[0]);}  /* cierre anterior: la base del cambio del periodo */

  return root;
}

/* ---- exportar e importar ---- */
function csvCell(v){const s=String(v==null?'':v);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function toCSV(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');}
const dec=n=>String(r2(n)).replace('.',',');
async function exportFile(name,text){
  if(DL){
    try{await DL.save({filename:name,data:text}); toast('Archivo listo'); return;}
    catch(e){ if(e&&e.code==='declined') return; if(e&&e.code!=='unavailable'&&e.code!=='not_granted'&&e.code!=='capability_disabled'&&e.code!=='capability_removed'){toast('No se pudo descargar'); return;} }
  }
  try{await navigator.clipboard.writeText(text); toast('Copiado al portapapeles. Pégalo en un archivo '+name.split('.').pop()+'.');}
  catch(e){toast('Este navegador no permite descargar ni copiar desde aquí');}
}
function viewDatos(){
  const tax=h('input',{type:'text',id:'tax',inputmode:'decimal',value:plain(S.aj.tax),style:'max-width:120px'});
  tax.addEventListener('change',()=>{const v=parseNum(tax.value); if(v>=0&&v<=60){S.aj.tax=v;touch();} tax.value=plain(S.aj.tax);});
  const px=h('input',{type:'url',id:'px',value:S.aj.proxy||'',placeholder:'https://…workers.dev',autocomplete:'off',spellcheck:'false'});
  const saveProxy=()=>{
    let v=px.value.trim().replace(/\/+$/,'');
    if(v&&!/^https?:\/\//i.test(v)) v='https://'+v;
    if(v&&!/^https:\/\/[^\s\/]+\.[^\s\/]+/.test(v)){toast('Esa dirección no parece válida. Debe ser como https://nombre.workers.dev');return false;}
    if(v!==(S.aj.proxy||'')){S.aj.proxy=v; touch();}
    px.value=v; return true;
  };
  px.addEventListener('change',()=>{if(saveProxy()) toast(S.aj.proxy?'Dirección guardada':'Conexión quitada');});
  const probarProxy=async()=>{ if(!saveProxy()) return; if(!proxyUrl()) return toast('Escribe primero la dirección del Worker.'); toast('Probando…');
    try{const o=await yhChart('EURUSD=X','5d','1d'); toast(o.err?'El Worker responde, pero Yahoo no devolvió datos.':'Conexión correcta: 1 € = '+PRICE.format(o.price)+' $');}catch(e){toast(yhErr(e));} };
  const file=h('input',{type:'file',accept:'.json,application/json',id:'imp',hidden:true});
  file.addEventListener('change',()=>{
    const f=file.files&&file.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(String(rd.result)); if(!o||!Array.isArray(o.movs)||!Array.isArray(o.pos)) throw 0;
        const n=normalize(o); commit(()=>{S=n;}); toast('Copia importada: '+n.movs.length+' movimientos y '+n.pos.length+' inversiones');}
      catch(e){toast('Ese archivo no es una copia válida');} file.value='';};
    rd.readAsText(f);
  });
  const nEj=S.movs.filter(m=>m.ej).length+S.pos.filter(p=>p.ej).length;
  const sec=(t,sub,...kids)=>h('section',{class:'card'},h('h2',null,t),sub?h('p',{class:'sub'},sub):null,h('div',{class:'acts',style:'margin-top:12px'},kids));
  return h('div',{class:'stack-v',style:'margin-top:16px'},
    sec('Dónde se guardan tus datos',MODE==='db'?'Se guardan en tu espacio privado de esta página. Si compartes el enlace, nadie más ve tus movimientos ni tu cartera.':'Se guardan solo en este navegador. Si lo borras o cambias de dispositivo, se pierden. Descarga una copia de vez en cuando.'),
    sec('Ajustes',null,h('div',{class:'field'},h('label',{for:'tax'},'Tipo fiscal estimado sobre plusvalías (%)'),tax,h('span',{class:'hint'},'Se usa solo para estimar el neto. No es asesoramiento fiscal.'))),
    sec('Cotizaciones automáticas fuera de Claude','Dirección de tu Worker de Cloudflare que consulta Yahoo Finance. Con ella, esta página busca valores y actualiza precios y históricos en euros desde cualquier navegador. Déjala vacía si no la usas.',
      h('div',{class:'field',style:'flex:1 1 100%'},h('label',{for:'px'},'Dirección del Worker'),px,h('span',{class:'hint'},'Por ejemplo https://libro-cotizaciones.tu-usuario.workers.dev')),
      h('button',{class:'btn',onclick:probarProxy},'Probar conexión')),
    sec('Exportar','Descarga tus datos para guardarlos o abrirlos en una hoja de cálculo.',
      h('button',{class:'btn',onclick:()=>exportFile('movimientos.csv',toCSV([['Fecha','Tipo','Categoría','Importe','Concepto']].concat(S.movs.slice().sort((a,b)=>a.fecha<b.fecha?-1:1).map(m=>[m.fecha,m.tipo==='ingreso'?'Ingreso':'Gasto',catName(m.tipo,m.cat),dec(m.importe),m.concepto]))))},'Movimientos (CSV)'),
      h('button',{class:'btn',onclick:()=>exportFile('operaciones.csv',toCSV([['Inversión','Fecha','Operación','Unidades','Precio','Comisión','Importe dividendo']].concat(S.pos.flatMap(p=>opsSorted(p).map(o=>[p.nombre,o.fecha,o.tipo,dec(o.uds),dec(o.precio),dec(o.com),dec(o.importe)]))))) },'Operaciones (CSV)'),
      h('button',{class:'btn',onclick:()=>exportFile('libro-de-cuentas-copia.json',JSON.stringify(S))},'Copia completa (JSON)')),
    sec('Importar','Restaura una copia completa. Sustituye todo lo que tienes ahora.',h('button',{class:'btn',onclick:()=>file.click()},'Elegir copia (JSON)'),file),
    nEj?sec('Datos de ejemplo','Hay '+nEj+' elementos de ejemplo mezclados con tus datos.',h('button',{class:'btn',onclick:removeExamples},'Quitar ejemplos')):null,
    sec('Borrar todo','Elimina movimientos, presupuestos e inversiones. No se puede deshacer.',confirmBtn('Borrar todos los datos','¿Seguro? Pulsa otra vez',()=>{commit(()=>{S=normalize({});});toast('Datos borrados');})));
}

/* ============ navegación y arranque ============ */
const TABS=[['resumen','Resumen',viewResumen],['movs','Movimientos',viewMovs],['presu','Presupuestos',viewPresu],['inv','Inversiones',viewInv],['calc','Calculadoras',viewCalc],['datos','Datos',viewDatos]];
const tabsEl=$('#tabs');
TABS.forEach(t=>tabsEl.append(h('button',{class:'tab',role:'tab',id:'tab-'+t[0],'data-t':t[0],onclick:()=>{V.tab=t[0];render();window.scrollTo(0,0);}},t[1])));
tabsEl.addEventListener('keydown',e=>{
  const i=TABS.findIndex(t=>t[0]===V.tab); let j=-1;
  if(e.key==='ArrowRight') j=(i+1)%TABS.length; else if(e.key==='ArrowLeft') j=(i-1+TABS.length)%TABS.length;
  if(j>=0){V.tab=TABS[j][0];render();$('#tab-'+V.tab).focus();e.preventDefault();}
});
$('#addMov').addEventListener('click',()=>formMov(null));

function render(){
  if(!S) return;
  hideTip();
  const y=window.scrollY, main=$('#main'), t=TABS.find(x=>x[0]===V.tab)||TABS[0];
  main.setAttribute('aria-labelledby','tab-'+t[0]);
  tabsEl.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.t===t[0];b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;if(on&&b.scrollIntoView&&!render.first) b.scrollIntoView({inline:'nearest',block:'nearest'});});
  render.first=false;
  main.replaceChildren(t[2]());
  window.scrollTo(0,y);
}
render.first=true;

async function boot(){
  let ref=null;
  try{
    if(window.claude&&window.claude.use){
      const r=await Promise.all([window.claude.use('user'),window.claude.use('db'),window.claude.use('downloads')]);
      DL=r[2]; const id=r[0]?await r[0].id():null;
      if(r[1]&&id) ref=r[1].collection('data/users/'+id).doc('libro');
    }
  }catch(e){ref=null;}
  if(ref){
    try{
      const snap=await ref.get(); MODE='db'; DBREF=ref;
      if(snap.exists&&snap.data()&&snap.data().json){lastJson=snap.data().json; S=normalize(JSON.parse(lastJson));}
      else S=loadLocal()||makeSeed();
      ref.onSnapshot(sn=>{
        if(!sn.exists||dirty||saving) return;
        const j=sn.data()&&sn.data().json; if(!j||j===lastJson) return;
        try{S=normalize(JSON.parse(j));lastJson=j;render();}catch(e){}
      },()=>{});
    }catch(e){MODE='local';DBREF=null;}
  }
  if(MODE==='local'){
    S=loadLocal()||makeSeed();
    try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');storageOK=true;}catch(e){storageOK=false;}
  }
  setStatus(MODE==='local'&&!storageOK?'mem':'ok');
  render();
  initMcp();
}
boot();
})();
</script>
